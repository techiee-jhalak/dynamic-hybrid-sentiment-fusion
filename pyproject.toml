[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-hybrid-sentiment-fusion"
version = "0.1.0"
description = "Dynamic Noise-Aware Lexicon-Transformer Fusion Framework for Sentiment Analysis of Code-Mixed Social Media Text"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Research Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.1",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "pyyaml>=6.0",
    "emoji>=2.8.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "sentencepiece==0.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.poetry]
# Disables Poetry's attempt to install this project as a Python package.
# This project is an application (src/api/, src/models/, frontend/) and
# does not need to be distributed as a package named dynamic-hybrid-sentiment-fusion.
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.11"
torch = { version = "2.14.0+cpu", source = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
